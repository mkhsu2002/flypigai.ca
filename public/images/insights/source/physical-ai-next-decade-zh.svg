<rect x="1010" y="763" width="510" height="52" rx="10" fill="#143f42"/>
      <text x="1265" y="796" text-anchor="middle" font-size="19" font-weight="650" letter-spacing="1.2" fill="#ffffff">再學習</text>

      <path d="M1533 789h13V297h-13" fill="none" stroke="#5c8c83" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="80" y1="890" x2="1520" y2="890" stroke="#bccbc4"/>
      <text x="80" y="928" font-size="23" font-weight="650" fill="#143f42">驗證重點：降低不同機器人本體之間的整合成本。</text>
      <text x="80" y="968" font-size="17" fill="#566b68">FlyPig AI 原創分析 · 2026 年 10 月 · 預測期間 2026–2036 · 並非產業標準</text>
