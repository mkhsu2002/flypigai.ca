      <text x="99" y="376" font-size="25" font-weight="650" fill="#182d31">能力與安全介面</text>
      <text x="99" y="401" font-size="18" fill="#4d6263">權限、限制與失敗狀態</text>
<rect x="80" y="428" width="810" height="70" rx="9" fill="#e4f3ed" stroke="#6bada0"/>
      <text x="99" y="458" font-size="25" font-weight="650" fill="#182d31">生命週期平台</text>
      <text x="99" y="483" font-size="18" fill="#4d6263">資料、模擬、訓練與部署</text>
<rect x="80" y="510" width="810" height="70" rx="9" fill="#fffefb" stroke="#d5ddd8"/>
      <text x="99" y="540" font-size="25" font-weight="650" fill="#182d31">基礎智慧</text>
      <text x="99" y="565" font-size="18" fill="#4d6263">世界模型與控制策略</text>
